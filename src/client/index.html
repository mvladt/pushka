<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Web Push — Клиент</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #fafaf8;
        color: #1a1a18;
        font:
          16px/1.5 ui-sans-serif,
          system-ui,
          "Helvetica Neue",
          Helvetica,
          sans-serif;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 64px 24px 96px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      h2 {
        margin: 0 0 12px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #85857d;
      }
      a {
        color: #1a1a18;
        text-decoration: none;
      }
      a:hover {
        color: #2f7d4f;
      }
      section {
        padding: 22px 0;
        border-top: 1px solid #e6e6e0;
      }
      label {
        display: block;
        margin-bottom: 12px;
      }
      label span {
        display: block;
        margin-bottom: 4px;
        font-size: 13px;
        color: #55554e;
      }
      input,
      button,
      select,
      textarea {
        font-size: 16px;
      }
      input {
        font: inherit;
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #d8d8d2;
        border-radius: 6px;
        background: #fff;
      }
      button {
        font: inherit;
        padding: 9px 16px;
        border: 1px solid #1a1a18;
        border-radius: 6px;
        background: #1a1a18;
        color: #fafaf8;
        cursor: pointer;
      }
      button:hover {
        background: #2f7d4f;
        border-color: #2f7d4f;
      }
      button:disabled {
        background: #d8d8d2;
        border-color: #d8d8d2;
        cursor: default;
      }
      #btn-permission {
        margin-top: 12px;
      }
      #error-box {
        margin: 12px 0 0;
        font-size: 14px;
        color: #c0392b;
        white-space: pre-wrap;
      }
      #success-box {
        margin: 12px 0 0;
        font-size: 14px;
        color: #2f7d4f;
      }
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      li {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 7px 0;
        border-bottom: 1px solid #f0f0ea;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Web Push — Клиент</h1>
      <a href="https://github.com/mvladt/pushka" target="_blank" rel="noopener"
        >Исходный код на GitHub ↗</a
      >

      <section>
        <h2>Статус</h2>
        <ul>
          <li><span>Service Worker</span><span id="status-sw">…</span></li>
          <li><span>Разрешение</span><span id="status-permission">…</span></li>
          <li><span>Push-подписка</span><span id="status-subscription">…</span></li>
        </ul>
        <button id="btn-permission" hidden>Разрешить уведомления</button>
      </section>

      <section id="form-section">
        <h2>Запланировать уведомление</h2>
        <label
          ><span>Заголовок</span><input id="input-title" type="text" placeholder="Привет!" required
        /></label>
        <label><span>Текст</span><input id="input-body" type="text" placeholder="Мир!" /></label>
        <label
          ><span>Время</span><input id="input-datetime" type="datetime-local" required
        /></label>
        <button id="btn-schedule" disabled>Запланировать</button>
        <div id="error-box"></div>
        <div id="success-box"></div>
      </section>

      <section>
        <h2>Получено</h2>
        <ul id="received-list"></ul>
      </section>
    </main>

    <script type="module">
      const API_ORIGIN = window.location.origin;

      const statusSw = document.getElementById("status-sw");
      const statusPermission = document.getElementById("status-permission");
      const statusSubscription = document.getElementById("status-subscription");
      const btnPermission = document.getElementById("btn-permission");
      const btnSchedule = document.getElementById("btn-schedule");
      const inputTitle = document.getElementById("input-title");
      const inputBody = document.getElementById("input-body");
      const inputDatetime = document.getElementById("input-datetime");
      const errorBox = document.getElementById("error-box");
      const successBox = document.getElementById("success-box");
      const receivedList = document.getElementById("received-list");

      let pushSubscription = null;

      // --- Утилиты ---

      function urlBase64ToUint8Array(base64String) {
        const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
        const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
        const raw = atob(base64);
        const arr = new Uint8Array(raw.length);
        for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
        return arr;
      }

      function setStatus(el, text) {
        el.textContent = text;
      }

      function showError(msg) {
        errorBox.textContent = msg;
        successBox.textContent = "";
      }

      function showSuccess(msg) {
        successBox.textContent = msg;
        errorBox.textContent = "";
      }

      function generateId() {
        return "id-" + Date.now().toString(16) + "-" + Math.random().toString(16).slice(2);
      }

      // --- 1. Проверка API ---

      if (!("serviceWorker" in navigator)) {
        setStatus(statusSw, "не поддерживается");
        throw new Error("Service Worker не поддерживается");
      }

      // --- 2. Регистрация Service Worker ---

      let registration;
      try {
        registration = await navigator.serviceWorker.register("/sw.js");
        await navigator.serviceWorker.ready;
        setStatus(statusSw, "активен");
      } catch (err) {
        setStatus(statusSw, "ошибка — " + err.message);
        throw err;
      }

      // --- 3. Проверка поддержки Push API (на iOS доступен только для сайта,
      //        добавленного на экран «Домой» — обычная вкладка Safari не подходит) ---

      if (!("Notification" in window) || !("PushManager" in window)) {
        const isIosOutsideHomeScreen = "standalone" in navigator && navigator.standalone === false;
        const hint = isIosOutsideHomeScreen
          ? "добавьте страницу на экран «Домой» (Поделиться → «На экран Домой», нужен iOS 16.4+) и откройте её оттуда"
          : "push не поддерживается в этом браузере";
        setStatus(statusPermission, hint);
        setStatus(statusSubscription, "недоступно");
        document.getElementById("form-section").hidden = true;
        throw new Error("Push API недоступен: " + hint);
      }

      // --- 4. Получение VAPID-ключа ---

      let vapidPublicKey;
      try {
        const res = await fetch(API_ORIGIN + "/api/key");
        if (!res.ok) throw new Error("HTTP " + res.status);
        vapidPublicKey = await res.text();
      } catch (err) {
        showError("Не удалось получить VAPID-ключ: " + err.message);
        throw err;
      }

      // --- 5. Разрешение на уведомления ---

      function updatePermissionStatus() {
        const perm = Notification.permission;
        if (perm === "granted") {
          setStatus(statusPermission, "выдано");
          btnPermission.hidden = true;
        } else if (perm === "denied") {
          setStatus(statusPermission, "отклонено. Разрешите в настройках браузера.");
          btnPermission.hidden = true;
        } else {
          setStatus(statusPermission, "не выдано");
          btnPermission.hidden = false;
        }
      }

      updatePermissionStatus();

      btnPermission.addEventListener("click", async () => {
        await Notification.requestPermission();
        updatePermissionStatus();
        if (Notification.permission === "granted") {
          await subscribeForPush();
        }
      });

      // --- 6. Push-подписка ---

      async function subscribeForPush() {
        if (!registration.pushManager) {
          setStatus(statusSubscription, "Push API не поддерживается");
          return;
        }
        setStatus(statusSubscription, "подключение…");
        try {
          pushSubscription = await registration.pushManager.getSubscription();
          if (!pushSubscription) {
            pushSubscription = await registration.pushManager.subscribe({
              userVisibleOnly: true,
              applicationServerKey: urlBase64ToUint8Array(vapidPublicKey),
            });
          }
          setStatus(statusSubscription, "активна");
          btnSchedule.disabled = false;
        } catch (err) {
          setStatus(statusSubscription, "ошибка — " + err.message);
        }
      }

      if (Notification.permission === "granted") {
        await subscribeForPush();
      } else {
        setStatus(statusSubscription, "ожидает разрешения");
      }

      // --- 7. Получение push-сообщений от SW ---

      navigator.serviceWorker.addEventListener("message", (event) => {
        if (event.data && event.data.type === "PUSH_RECEIVED") {
          const { title, body, receivedAt } = event.data.payload;
          const time = new Date(receivedAt).toLocaleTimeString();
          const li = document.createElement("li");
          const text = document.createElement("span");
          text.textContent = (title || "") + (body ? " — " + body : "");
          const timeEl = document.createElement("span");
          timeEl.style.color = "#85857d";
          timeEl.style.fontSize = "14px";
          timeEl.textContent = time;
          li.append(text, timeEl);
          receivedList.prepend(li);
        }
      });

      // --- 8. Отправка формы ---

      btnSchedule.addEventListener("click", async () => {
        const title = inputTitle.value.trim();
        const datetime = inputDatetime.value;

        if (!title || !datetime) {
          showError("Заполните заголовок и время.");
          return;
        }

        const notification = {
          id: generateId(),
          payload: { title, body: inputBody.value.trim() },
          datetime: new Date(datetime).toISOString(),
          subscription: pushSubscription.toJSON(),
        };

        try {
          const res = await fetch(API_ORIGIN + "/api/notifications", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(notification),
          });

          if (!res.ok) {
            const text = await res.text();
            showError("Ошибка: HTTP " + res.status + (text ? " — " + text : ""));
            return;
          }

          showSuccess("Уведомление запланировано на " + new Date(datetime).toLocaleString());
          inputTitle.value = "";
          inputBody.value = "";
          inputDatetime.value = "";
        } catch (err) {
          showError("Ошибка отправки: " + err.message);
        }
      });

      // TODO: Что-то слишком много строк.
    </script>
  </body>
</html>
