name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc
      - name: Lint
        run: npm run lint
      - name: Форматирование
        run: npm run format:check
      - name: Тесты env
        run: npm run test:env
      - name: Тесты sqliteStore
        run: npm run test:sqliteStore
      - name: Интеграционные тесты
        run: npm run test:integration
      - name: Аудит зависимостей
        run: npm audit --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Установка браузера
        run: npx playwright install --with-deps chrome
      - name: Playwright
        run: npm run test:playwright
      - name: Артефакты при падении
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
